baseURL = "https://prithvi-raj-b.github.io/"
title = "Prithvi Raj Baskar"
languageCode = "en"

# Must stay above the first [table] header, otherwise TOML scopes it to that table and Hugo ignores it.
# No tags or categories are used, so skip the empty /tags and /categories pages.
disableKinds = ["RSS", "taxonomy", "term"]

# Exclude footer section from generating list pages (index.html and index.xml)
[outputs]
  page = ["HTML"]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]
  footer = []

# Explicitly prevent the footer section from generating any output
[outputFormats.footerSection]
  # Empty configuration to prevent any output

# Content that only feeds homepage sections (or isn't used) shouldn't get its own page.
# list = "always" keeps it available to the homepage templates.
[[cascade]]
  [cascade.build]
    render = "never"
    list = "always"
  [cascade.target]
    path = "{/home,/home/**,/education,/education/**,/experience,/experience/**,/footer,/footer/**,/other-projects,/search}"

[module]
[[module.imports]]
path = "github.com/zetxek/adritian-free-hugo-theme"

## Base mounts - so your site's assets are available
[[module.mounts]]
source = "archetypes"
target = "archetypes"

[[module.mounts]]
source = "assets"
target = "assets"

[[module.mounts]]
source = "i18n"
target = "i18n"

[[module.mounts]]
source = "layouts"
target = "layouts"

[[module.mounts]]
source = "static"
target = "static"

# The following mounts are required for the theme to be able to load bootstrap
# Remember also to copy the theme's `package.json` to your site, and run `npm install`
[[module.mounts]]
source = "node_modules/bootstrap/scss"
target = "assets/scss/bootstrap"

[[module.mounts]]
source = "node_modules/bootstrap/dist/js"
target = "assets/js/bootstrap"

[[module.mounts]]
source = "node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"
target = "assets/js/vendor/bootstrap.bundle.min.js"

[[module.mounts]]
source = "node_modules/bootstrap-print-css/css/bootstrap-print.css"
target = "assets/css/bootstrap-print.css"


[params]
title = 'Prithvi Raj Baskar | Robotics Engineer'
description = 'Robotics engineer working on perception, manipulation and autonomous navigation. M.S. Robotics Engineering at Worcester Polytechnic Institute.'
images = ['/img/og-preview.png']
sections = [
  "showcase",
  "about",
  "education",
  "experience",
  "client-and-work",
  "testimonial",
  "contact",
  "newsletter",
]
# If you want to display an image logo in the header, you can add it here
# logo = '/img/hugo.svg'

homepageExperienceCount = 6

# Analytics are disabled. The theme reads these keys, so keep the tables;
# to enable, add a tracking code and set enabled = true.
[params.analytics]
vercelPageInsights = false
vercelAnalytics = false
[params.analytics.googleAnalytics]
enabled = false
[params.analytics.googleTagManager]
enabled = false

[build]
writeStats = true

[build.buildStats]
enabledFor = ["scss"]
disableClasses = false
disableIDs = false
disableTags = false
enable = true

[params.languages.selector.disable]
footer = false
header = false
mobileHeader = false

